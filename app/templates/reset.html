{% extends "base.html" %}{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}<section class="sec" style="max-width:460px"><h1 style="font-size:clamp(36px,6vw,60px);margin-bottom:24px">Choose a new password</h1>
<form method="post" class="st"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>New password (10+ characters)<input name="password" type="password" required minlength="10" autocomplete="new-password"></label><button class="btn">Save password</button></form></section>{% endblock %}
