{% extends "base.html" %}{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}<section class="sec" style="max-width:720px"><h1 style="font-size:clamp(34px,5vw,56px);margin-bottom:24px">{{ 'Edit product' if p else 'New product' }}</h1>
<form method="post" enctype="multipart/form-data" class="st"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="id" value="{{ p.id if p else 0 }}">
<label>Title<input name="title" required maxlength="160" value="{{ p.title if p }}"></label>
<label>One-line summary<input name="summary" maxlength="300" value="{{ p.summary if p }}"></label>
<label>Description (basic HTML allowed)<textarea name="body">{{ p.body if p }}</textarea></label>
<label>Type (Source code, Automation, Subscription...)<input name="kind" maxlength="40" value="{{ p.kind if p else 'Download' }}"></label>
<label>Price in USD (must match your Lemon Squeezy variant)<input name="price_usd" type="number" step="0.01" min="0" value="{{ '%.2f'|format(p.price_cents/100) if p else '19.00' }}"></label>
<label>Billing<select name="per"><option value="">One-time</option><option value="month" {{ 'selected' if p and p.per }}>Monthly</option></select></label>
<label>Lemon Squeezy variant ID<input name="ls_variant" value="{{ p.ls_variant if p }}"></label>
<label>Delivery file (zip, pdf, etc., max 100 MB){% if p and p.file_name %} (a file is attached; upload to replace){% endif %}<input type="file" name="file"></label>
<label>Cover image (PNG, JPG or WebP, max 3 MB){% if p and p.image %} (replace by uploading again){% endif %}<input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label>
<label>Or delivery link (https only)<input name="link" value="{{ p.link if p }}"></label>
{% if u.role == 'admin' %}<label>Status<select name="status">{% for s in ['live','hidden','pending'] %}<option {{ 'selected' if p and p.status==s }}>{{ s }}</option>{% endfor %}</select></label>{% endif %}
<button class="btn">Save</button></form></section>{% endblock %}
